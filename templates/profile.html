{{define "content"}}
    <h2>{{.T "profile.title"}}</h2>

    <div class="card" style="max-width: 520px; margin-bottom: 2rem;">
        <p style="color:#aaa; margin-top:0;">{{.T "profile.logged_in_as"}} <strong>{{.User.Username}}</strong></p>

        <h3>{{.T "profile.change_password"}}</h3>
        <form method="POST" action="/profile/change-password">
            <div class="form-group">
                <label>{{.T "profile.old_password"}}</label>
                <input type="password" name="old_password" required>
            </div>
            <div class="form-group">
                <label>{{.T "profile.new_password"}}</label>
                <input type="password" name="new_password" required minlength="4">
            </div>
            <div class="form-group">
                <label>{{.T "profile.confirm_password"}}</label>
                <input type="password" name="confirm_password" required minlength="4">
            </div>
            <button type="submit">{{.T "profile.save_password"}}</button>
        </form>
    </div>
{{end}}
